[project]
name = "scholarrag"
version = "0.1.0"
description = "Traceable agentic RAG for loss-aware academic paper reading"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jsonschema>=4.25.0",
  "numpy>=2.1.0",
  "opentelemetry-api>=1.35.0",
  "opentelemetry-exporter-otlp-proto-http>=1.35.0",
  "opentelemetry-instrumentation-fastapi>=0.56b0",
  "opentelemetry-sdk>=1.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pymupdf>=1.26.0",
  "pypdf>=5.8.0",
  "python-multipart>=0.0.20",
  "qdrant-client>=1.15.0",
  "tenacity>=9.1.0",
  "typer>=0.16.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
paddle = ["paddleocr>=3.7.0"]
eval = [
  "langchain>=0.3.27,<1.0.0",
  "langchain-community>=0.3.31,<0.4.0",
  "langchain-core>=0.3.75,<1.0.0",
  "openai>=2.0.0",
  "ragas>=0.4.0,<0.5.0",
]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[project.scripts]
scholarrag = "scholarrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarrag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
