services:
  api:
    build: .
    env_file: .env
    environment:
      SCHOLARRAG_AUTH_MODE: session
      SCHOLARRAG_DATA_DIR: /data
      SCHOLARRAG_EVALS_DIR: /app/evals
      SCHOLARRAG_QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - scholarrag-data:/data
      - ./evals:/app/evals
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')" ]
      interval: 15s
      timeout: 5s
      retries: 5

  query-worker:
    build: .
    command: ["uv", "run", "scholarrag", "worker"]
    env_file: .env
    environment:
      SCHOLARRAG_AUTH_MODE: session
      SCHOLARRAG_DATA_DIR: /data
      SCHOLARRAG_EVALS_DIR: /app/evals
      SCHOLARRAG_QDRANT_URL: http://qdrant:6333
    volumes:
      - scholarrag-data:/data
      - ./evals:/app/evals
    depends_on:
      qdrant:
        condition: service_healthy

  ingestion-worker:
    build: .
    command: ["uv", "run", "scholarrag", "worker", "--kind", "ingestion"]
    env_file: .env
    environment:
      SCHOLARRAG_AUTH_MODE: session
      SCHOLARRAG_DATA_DIR: /data
      SCHOLARRAG_EVALS_DIR: /app/evals
      SCHOLARRAG_QDRANT_URL: http://qdrant:6333
    volumes:
      - scholarrag-data:/data
      - ./evals:/app/evals
    depends_on:
      qdrant:
        condition: service_healthy

  evaluation-worker:
    build: .
    command: ["uv", "run", "scholarrag", "worker", "--kind", "evaluation"]
    env_file: .env
    environment:
      SCHOLARRAG_AUTH_MODE: session
      SCHOLARRAG_DATA_DIR: /data
      SCHOLARRAG_EVALS_DIR: /app/evals
      SCHOLARRAG_QDRANT_URL: http://qdrant:6333
    volumes:
      - scholarrag-data:/data
      - ./evals:/app/evals
    depends_on:
      qdrant:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.15
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'" ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  scholarrag-data:
  qdrant-data:
